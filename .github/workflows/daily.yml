name: arXiv Multi-Category Daily Digest

on:
  workflow_dispatch:  # Triggered by cron-job.org or manual trigger from GitHub UI
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, e.g. 2026-07-02). Leave empty for yesterday.'
        required: false
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai
          pip show openai | head -3
          python -c "from openai import OpenAI; print('openai OK')"

      - name: Calculate date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            OVERRIDE="${{ github.event.inputs.date }}"
            YESTERDAY_DISPLAY=$(echo "$OVERRIDE" | sed 's/-/年/;s/-/月/')日
            YESTERDAY=$(TZ='Asia/Shanghai' date -d "$OVERRIDE -1 day" '+%Y%m%d')
          else
            YESTERDAY=$(TZ='Asia/Shanghai' date -d 'yesterday' '+%Y%m%d')
            YESTERDAY_DISPLAY=$(TZ='Asia/Shanghai' date '+%Y年%m月%d日')
          fi
          echo "api_date=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "display_date=$YESTERDAY_DISPLAY" >> $GITHUB_OUTPUT
          echo "Query: $YESTERDAY, Display: $YESTERDAY_DISPLAY"

      # ── Fetch all categories ──
      - name: Fetch papers from arXiv (all categories)
        run: |
          python scripts/fetch_papers.py ${{ steps.date.outputs.api_date }} ./outputs/ 2>&1 || {
            echo "::warning::fetch_papers.py failed — continuing"
          }

      - name: Check summary
        id: check
        run: |
          if [ -f "./outputs/summary.json" ]; then
            echo "has_summary=true" >> $GITHUB_OUTPUT
            cat ./outputs/summary.json
          else
            echo "has_summary=false" >> $GITHUB_OUTPUT
            echo "No summary.json found"
          fi

      # ── Translate all categories (one unified step, never fails) ──
      - name: Translate all categories
        id: translate
        if: steps.check.outputs.has_summary == 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          LOG="./outputs-public/translate-log.txt"
          mkdir -p ./outputs-public

          log() { echo "[$(date '+%H:%M:%S')] $*"; }

          log "=== Py version ==="
          python --version 2>&1 | tee "$LOG"

          log "=== Import check ==="
          python -c "import sys; sys.path.insert(0,'scripts'); from translate_cloud import build_prompt; print('OK')" 2>&1 | tee -a "$LOG"

          log "=== Paper counts ===" | tee -a "$LOG"
          for CAT in gr-qc hep-th astro-ph; do
            JSON="./outputs/${CAT}.json"
            if [ -f "$JSON" ]; then
              python -c "import json; print(len(json.load(open('${JSON}'))))" 2>&1 | tee -a "$LOG" | xargs -I{} echo "$CAT: {} papers"
            fi
          done

          log "=== Translating ===" | tee -a "$LOG"
          CI=0
          for CAT in gr-qc hep-th astro-ph; do
            JSON="./outputs/${CAT}.json"
            if [ -f "$JSON" ]; then
              COUNT=$(python -c "import json; print(len(json.load(open('${JSON}'))))" 2>&1)
              if [ "$COUNT" -gt 0 ] 2>/dev/null; then
                log "Starting $CAT ($COUNT papers)" | tee -a "$LOG"
                for START in 0 3 6 9 12 15 18 21 24 27 30; do
                  if [ "$START" -lt "$COUNT" ] 2>/dev/null; then
                    log "  $CAT batch $START" | tee -a "$LOG"
                    python scripts/translate_cloud.py "$JSON" --category "$CAT" --batch-size 3 --batch-start $START 2>&1 | tee -a "$LOG"
                  fi
                done
                log "Finished $CAT" | tee -a "$LOG"
              else
                log "$CAT: 0 papers, skip" | tee -a "$LOG"
              fi
            fi
            if [ $CI -lt 2 ]; then
              log "Sleep 90s between categories..." | tee -a "$LOG"
              sleep 90
            fi
            CI=$((CI + 1))
          done
          log "=== Done ===" | tee -a "$LOG"

      # ── Build Hub HTML (always if have summary) ──
      - name: Build Hub HTML
        if: steps.check.outputs.has_summary == 'true'
        run: |
          mkdir -p ./outputs-public
          python scripts/build_hub.py \
            ./outputs/summary.json \
            ./outputs-public/latest.html \
            "${{ steps.date.outputs.display_date }}"

      # ── Build per-category HTML ──
      - name: Build category HTML pages
        if: steps.check.outputs.has_summary == 'true'
        run: |
          for CAT in gr-qc hep-th astro-ph; do
            JSON="./outputs/${CAT}.json"
            echo "--- $CAT ---"
            if [ -f "$JSON" ]; then
              COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))" 2>&1 || echo "0")
              if [ "$COUNT" -gt 0 ] 2>/dev/null; then
                HTML="./outputs-public/arxiv-${CAT}-${{ steps.date.outputs.api_date }}.html"
                python scripts/build_html.py "$JSON" "$HTML" "${{ steps.date.outputs.display_date }}" --category "$CAT" 2>&1 || {
                  echo "::warning::build_html $CAT failed"
                }
                cp "$HTML" "./outputs-public/${CAT}-latest.html" 2>/dev/null || true
              else
                echo "$CAT: 0 papers, skipping HTML"
              fi
            else
              echo "$CAT: no JSON, skipping HTML"
            fi
          done

      # ── PushPlus notification ──
      - name: Send PushPlus notification
        if: steps.check.outputs.has_summary == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DATE_DISPLAY: ${{ steps.date.outputs.display_date }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.html
        run: |
          python << 'PYEOF'
          import json, os, subprocess

          with open('./outputs/summary.json', 'r') as f:
              summary = json.load(f)

          cat_config = [
              ('gr-qc',    '\U0001f300', '#2563eb', 'gr-qc-latest.html', '\u5f15\u529b\u4e0e\u91cf\u5b50\u5b87\u5b99\u5b66'),
              ('hep-th',   '\u269b\ufe0f', '#7c3aed', 'hep-th-latest.html', '\u9ad8\u80fd\u7406\u8bba\u7269\u7406'),
              ('astro-ph', '\U0001f52d', '#059669', 'astro-ph-latest.html', '\u5929\u4f53\u7269\u7406\u5b66'),
          ]

          base = os.environ.get('PAGE_URL', '#')
          date_display = os.environ.get('DATE_DISPLAY', '')

          lines = ['<h3>\U0001f4f0 arXiv \u4eca\u65e5\u8bba\u6587\u901f\u89c8 | %s</h3>' % date_display]
          lines.append('<p><a href="%s">\U0001f517 \u67e5\u770b Hub \u5bfc\u822a\u9875</a></p>' % base)
          lines.append('<hr>')

          for cat, emoji, color, page, name in cat_config:
              count = summary.get(cat, 0)
              url = base.replace('latest.html', page)
              if count > 0:
                  lines.append(
                      '<p style="font-size:16px;margin:8px 0">'
                      '<a href="%s" style="color:%s;text-decoration:none;font-weight:600">'
                      '%s %s\uff08%s\uff09\uff1a%d \u7bc7</a></p>'
                      % (url, color, emoji, name, cat, count)
                  )
              else:
                  lines.append(
                      '<p style="font-size:16px;margin:8px 0;color:#9ca3af">'
                      '%s %s\uff08%s\uff09\uff1a\u6ca1\u66f4\u65b0</p>'
                      % (emoji, name, cat)
                  )

          lines.append('<hr>')
          lines.append(
              '<p style="color:#999;font-size:12px">'
              '\u6bcf\u65e5 12:00 \u81ea\u52a8\u63a8\u9001 &middot; '
              '<a href="%s">\u67e5\u770b\u5b8c\u6574\u62a5\u544a</a></p>' % base
          )

          content = ''.join(lines)
          title = 'arXiv Daily | %s' % date_display
          token = os.environ.get('PUSHPLUS_TOKEN', '')

          subprocess.run(['curl', '-s', '-X', 'POST',
              'https://www.pushplus.plus/send',
              '-H', 'Content-Type: application/json',
              '-d', json.dumps({'token': token, 'title': title, 'content': content, 'template': 'html'})
          ], check=False)

          subprocess.run(['curl', '-s', '-X', 'POST',
              'https://www.pushplus.plus/send',
              '-H', 'Content-Type: application/json',
              '-d', json.dumps({'token': token, 'title': title, 'content': content, 'template': 'html', 'topic': 'arxiv-gr-qc'})
          ], check=False)

          print('PushPlus notifications sent.')
          PYEOF

      # ── GitHub Pages ──
      - name: Setup Pages
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./outputs-public

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/deploy-pages@v4

      # ── No papers (fallback) ──
      - name: No papers notification
        if: steps.check.outputs.has_summary == 'false'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          DATE_DISPLAY="${{ steps.date.outputs.display_date }}"
          MSG="arXiv Daily ${DATE_DISPLAY}：所有分区均无更新"
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"arXiv Daily | ${DATE_DISPLAY}\",\"content\":\"${MSG}\"}"
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"arXiv Daily | ${DATE_DISPLAY}\",\"content\":\"${MSG}\",\"topic\":\"arxiv-gr-qc\"}"
