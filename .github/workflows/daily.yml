name: arXiv Multi-Category Daily Digest

on:
  workflow_dispatch:  # Triggered by cron-job.org or manual trigger from GitHub UI
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, e.g. 2026-07-02). Leave empty for yesterday.'
        required: false
        default: ''

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Calculate date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            OVERRIDE="${{ github.event.inputs.date }}"
            YESTERDAY_DISPLAY=$(echo "$OVERRIDE" | sed 's/-/年/;s/-/月/')日
            YESTERDAY=$(TZ='Asia/Shanghai' date -d "$OVERRIDE -1 day" '+%Y%m%d')
          else
            YESTERDAY=$(TZ='Asia/Shanghai' date -d 'yesterday' '+%Y%m%d')
            YESTERDAY_DISPLAY=$(TZ='Asia/Shanghai' date '+%Y年%m月%d日')
          fi
          echo "api_date=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "display_date=$YESTERDAY_DISPLAY" >> $GITHUB_OUTPUT
          echo "Query: $YESTERDAY, Display: $YESTERDAY_DISPLAY"

      # ── Fetch all categories ──
      - name: Fetch papers from arXiv (all categories)
        run: |
          python scripts/fetch_papers.py ${{ steps.date.outputs.api_date }} ./outputs/ 2>&1 || {
            echo "::warning::fetch_papers.py failed — continuing with partial results"
          }


      - name: Check summary
        id: check
        run: |
          if [ -f "./outputs/summary.json" ]; then
            echo "has_summary=true" >> $GITHUB_OUTPUT
            cat ./outputs/summary.json
          else
            echo "has_summary=false" >> $GITHUB_OUTPUT
            echo "No summary.json found"
          fi

      # ── Translate: gr-qc ──
      - name: Translate gr-qc
        if: steps.check.outputs.has_summary == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          JSON="./outputs/gr-qc.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))" 2>/dev/null || echo "0")
            echo "gr-qc papers: $COUNT"
            for START in 0 5 10 15; do
              if [ "$START" -lt "$COUNT" ]; then
                echo "gr-qc batch: $START-$((START+5)) of $COUNT"
                python scripts/translate_cloud.py "$JSON" --category gr-qc --batch-size 5 --batch-start $START || exit 1
              fi
            done
          else
            echo "gr-qc: no JSON file, skipping"
          fi

      # ── Translate: hep-th ──
      - name: Translate hep-th
        if: steps.check.outputs.has_summary == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          JSON="./outputs/hep-th.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))" 2>/dev/null || echo "0")
            echo "hep-th papers: $COUNT"
            for START in 0 5 10 15; do
              if [ "$START" -lt "$COUNT" ]; then
                echo "hep-th batch: $START-$((START+5)) of $COUNT"
                python scripts/translate_cloud.py "$JSON" --category hep-th --batch-size 5 --batch-start $START || exit 1
              fi
            done
          else
            echo "hep-th: no JSON file, skipping"
          fi

      # ── Translate: astro-ph ──
      - name: Translate astro-ph
        if: steps.check.outputs.has_summary == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          JSON="./outputs/astro-ph.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))" 2>/dev/null || echo "0")
            echo "astro-ph papers: $COUNT"
            for START in 0 5 10 15; do
              if [ "$START" -lt "$COUNT" ]; then
                echo "astro-ph batch: $START-$((START+5)) of $COUNT"
                python scripts/translate_cloud.py "$JSON" --category astro-ph --batch-size 5 --batch-start $START || exit 1
              fi
            done
          else
            echo "astro-ph: no JSON file, skipping"
          fi

      # ── Build HTML: Hub ──
      - name: Build Hub HTML
        if: steps.check.outputs.has_summary == 'true'
        run: |
          mkdir -p ./outputs-public
          python scripts/build_hub.py \
            ./outputs/summary.json \
            ./outputs-public/latest.html \
            "${{ steps.date.outputs.display_date }}"

      # ── Build HTML: per category ──
      - name: Build gr-qc HTML
        if: steps.check.outputs.has_summary == 'true'
        run: |
          JSON="./outputs/gr-qc.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))")
            if [ "$COUNT" -gt 0 ]; then
              HTML="./outputs-public/arxiv-gr-qc-${{ steps.date.outputs.api_date }}.html"
              python scripts/build_html.py "$JSON" "$HTML" "${{ steps.date.outputs.display_date }}" --category gr-qc
              cp "$HTML" "./outputs-public/gr-qc-latest.html"
            else
              echo "gr-qc: 0 papers, skipping HTML"
            fi
          fi

      - name: Build hep-th HTML
        if: steps.check.outputs.has_summary == 'true'
        run: |
          JSON="./outputs/hep-th.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))")
            if [ "$COUNT" -gt 0 ]; then
              HTML="./outputs-public/arxiv-hep-th-${{ steps.date.outputs.api_date }}.html"
              python scripts/build_html.py "$JSON" "$HTML" "${{ steps.date.outputs.display_date }}" --category hep-th
              cp "$HTML" "./outputs-public/hep-th-latest.html"
            else
              echo "hep-th: 0 papers, skipping HTML"
            fi
          fi

      - name: Build astro-ph HTML
        if: steps.check.outputs.has_summary == 'true'
        run: |
          JSON="./outputs/astro-ph.json"
          if [ -f "$JSON" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('$JSON'))))")
            if [ "$COUNT" -gt 0 ]; then
              HTML="./outputs-public/arxiv-astro-ph-${{ steps.date.outputs.api_date }}.html"
              python scripts/build_html.py "$JSON" "$HTML" "${{ steps.date.outputs.display_date }}" --category astro-ph
              cp "$HTML" "./outputs-public/astro-ph-latest.html"
            else
              echo "astro-ph: 0 papers, skipping HTML"
            fi
          fi

      # ── PushPlus notification ──
      - name: Send PushPlus notification
        if: success() && steps.check.outputs.has_summary == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DATE_DISPLAY: ${{ steps.date.outputs.display_date }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.html
        run: |
          python << 'PYEOF'
          import json, os

          with open('./outputs/summary.json', 'r') as f:
              summary = json.load(f)

          cat_config = [
              ('gr-qc',    '\U0001f300', '#2563eb', 'gr-qc-latest.html', '\u5f15\u529b\u4e0e\u91cf\u5b50\u5b87\u5b99\u5b66'),
              ('hep-th',   '\u269b\ufe0f', '#7c3aed', 'hep-th-latest.html', '\u9ad8\u80fd\u7406\u8bba\u7269\u7406'),
              ('astro-ph', '\U0001f52d', '#059669', 'astro-ph-latest.html', '\u5929\u4f53\u7269\u7406\u5b66'),
          ]

          base = os.environ.get('PAGE_URL', '#')
          date_display = os.environ.get('DATE_DISPLAY', '')

          lines = ['<h3>\U0001f4f0 arXiv \u4eca\u65e5\u8bba\u6587\u901f\u89c8 | %s</h3>' % date_display]
          lines.append('<p><a href="%s">\U0001f517 \u67e5\u770b Hub \u5bfc\u822a\u9875</a></p>' % base)
          lines.append('<hr>')

          for cat, emoji, color, page, name in cat_config:
              count = summary.get(cat, 0)
              url = base.replace('latest.html', page)
              if count > 0:
                  lines.append(
                      '<p style="font-size:16px;margin:8px 0">'
                      '<a href="%s" style="color:%s;text-decoration:none;font-weight:600">'
                      '%s %s\uff08%s\uff09\uff1a%d \u7bc7</a></p>'
                      % (url, color, emoji, name, cat, count)
                  )
              else:
                  lines.append(
                      '<p style="font-size:16px;margin:8px 0;color:#9ca3af">'
                      '%s %s\uff08%s\uff09\uff1a\u6ca1\u66f4\u65b0</p>'
                      % (emoji, name, cat)
                  )

          lines.append('<hr>')
          lines.append(
              '<p style="color:#999;font-size:12px">'
              '\u6bcf\u65e5 12:00 \u81ea\u52a8\u63a8\u9001 &middot; '
              '<a href="%s">\u67e5\u770b\u5b8c\u6574\u62a5\u544a</a></p>' % base
          )

          content = ''.join(lines)
          title = 'arXiv Daily | %s' % date_display

          import subprocess

          token = os.environ.get('PUSHPLUS_TOKEN', '')

          # Personal push
          subprocess.run([
              'curl', '-s', '-X', 'POST',
              'https://www.pushplus.plus/send',
              '-H', 'Content-Type: application/json',
              '-d', json.dumps({
                  'token': token,
                  'title': title,
                  'content': content,
                  'template': 'html'
              })
          ], check=False)

          # Topic group push
          subprocess.run([
              'curl', '-s', '-X', 'POST',
              'https://www.pushplus.plus/send',
              '-H', 'Content-Type: application/json',
              '-d', json.dumps({
                  'token': token,
                  'title': title,
                  'content': content,
                  'template': 'html',
                  'topic': 'arxiv-gr-qc'
              })
          ], check=False)

          print('PushPlus notifications sent.')
          PYEOF

      # ── GitHub Pages ──
      - name: Setup Pages
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./outputs-public

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.has_summary == 'true'
        uses: actions/deploy-pages@v4

      # ── No papers (fallback) ──
      - name: No papers notification
        if: steps.check.outputs.has_summary == 'false'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          DATE_DISPLAY="${{ steps.date.outputs.display_date }}"
          MSG="arXiv Daily ${DATE_DISPLAY}：所有分区均无更新"
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"arXiv Daily | ${DATE_DISPLAY}\",\"content\":\"${MSG}\"}"
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"arXiv Daily | ${DATE_DISPLAY}\",\"content\":\"${MSG}\",\"topic\":\"arxiv-gr-qc\"}"
