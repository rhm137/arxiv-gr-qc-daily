name: probe arXiv endpoints
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        run: |
          probe() {
            code=$(curl -s -o /tmp/probe.out -w "%{http_code}" -A "WorkBuddy-arxiv-digest/2.0" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              --max-time 30 "$1")
            echo "== $1 -> HTTP $code ($(wc -c < /tmp/probe.out) bytes)"
            head -c 300 /tmp/probe.out; echo
          }
          probe "https://rss.arxiv.org/rss/gr-qc"
          probe "https://export.arxiv.org/api/query?id_list=2609.16016&max_results=1"
          probe "https://arxiv.org/list/gr-qc/new?skip=0&show=25"
